<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Orbit</title>
  <meta name="description" content="Orbit is a general-purpose AI chatbot powered by Groq.">
  <meta name="color-scheme" content="dark light">
  <link rel="icon" href="assets/robot.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script>
    // Apply the saved theme before first paint to avoid a flash.
    try {
      var t = localStorage.getItem("orbit-theme");
      if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
    } catch (e) {}
  </script>
</head>
<body>
  <a class="skip-link" href="#composer-input">Skip to message box</a>

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-name">Orbit</span>
      <span class="brand-tag mono">AI&nbsp;CHAT</span>
    </div>
    <div class="topbar-actions">
      <button type="button" class="btn btn-ghost" id="new-chat">
        <span aria-hidden="true">+</span> New chat
      </button>
      <button type="button" class="btn btn-icon" id="theme-toggle" aria-label="Switch to light theme" aria-pressed="false">
        <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="12" r="4.5" fill="currentColor"/><g stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></g></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M20.5 14.6A8.5 8.5 0 0 1 9.4 3.5a8.5 8.5 0 1 0 11.1 11.1z"/></svg>
      </button>
    </div>
  </header>

  <main class="layout">
    <section class="scene" aria-label="Orbit">
      <div class="scene-grid" aria-hidden="true"></div>
      <div class="bubble" id="robot-bubble">
        <p>Hey, I’m Orbit. What’s on your mind?</p>
      </div>
      <div class="robot-wrap">
        <img class="robot" src="assets/robot.png" alt="Orbit, a pixel-art robot" width="320" height="320">
        <div class="robot-shadow" aria-hidden="true"></div>
      </div>
      <p class="scene-label mono" aria-hidden="true"><span class="dot"></span> ONLINE · POWERED BY GROQ</p>
    </section>

    <section class="chat" aria-label="Conversation">
      <div class="messages" id="messages" role="log" aria-live="polite" aria-relevant="additions" tabindex="0" aria-label="Messages">
        <div class="empty" id="empty-state">
          <p class="mono empty-label">TRY ASKING</p>
          <ul class="suggestions" id="suggestions">
            <li><button type="button" class="chip" data-accent="lime">Explain how vaccines train the immune system</button></li>
            <li><button type="button" class="chip" data-accent="blue">Brainstorm 10 names for a coffee subscription</button></li>
            <li><button type="button" class="chip" data-accent="coral">Write a friendly email asking for a deadline extension</button></li>
            <li><button type="button" class="chip" data-accent="lime">What’s the difference between a list and a tuple in Python?</button></li>
          </ul>
        </div>
      </div>

      <div class="status mono" id="status" role="status" aria-live="polite"></div>

      <form class="composer" id="composer" novalidate>
        <label for="composer-input" class="visually-hidden">Message Orbit</label>
        <textarea id="composer-input" rows="1" maxlength="4000" placeholder="Ask Orbit anything…" autocomplete="off" aria-describedby="composer-hint char-count"></textarea>
        <div class="composer-row">
          <span class="mono hint" id="composer-hint">Enter to send · Shift+Enter for a new line</span>
          <span class="mono count" id="char-count" aria-live="off">0 / 4000</span>
          <button type="submit" class="btn btn-send" id="send-btn" aria-label="Send message" disabled>
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M3.4 20.4 21 12 3.4 3.6 3.3 10l12.4 2-12.4 2z"/></svg>
          </button>
        </div>
      </form>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
